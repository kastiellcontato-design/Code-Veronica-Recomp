PPU-df822d7d47de09c5672201db8cc633009037f54f: # RESIDENT EVIL CODE: Veronica X (EU)
  "Skip Logos and Intro":
    Games:
      "RESIDENT EVIL CODE: Veronica X":
        NPEB00553: [ 01.00 ]
    Author: "Kastiel"
    Notes: "EN: Skips the CAPCOM and MT FRAMEWORK logos and the intro movie, so the game opens straight on the title screen. PT-BR: Pula os logos da CAPCOM e da MT FRAMEWORK e o vídeo de introdução: o jogo abre direto na tela de título."
    Patch Version: 1.0
    Patch:
      - [ be32, 0x00201444, 0x60000000 ] # logos: end as soon as they start
      - [ be32, 0x0002b450, 0x60000000 ] # intro movie: not started
      - [ be32, 0x0002b454, 0x3860ffff ] # title: straight to PRESS START

  "Start with Sniper Rifle":
    Games:
      "RESIDENT EVIL CODE: Veronica X":
        NPEB00553: [ 01.00 ]
    Author: "Kastiel"
    Notes: "EN: A New Game starts with the Sniper Rifle in your inventory, plus 100 rounds of its ammo. Enable it before starting a New Game; saved games are not changed. PT-BR: Um Novo Jogo começa com o Sniper Rifle no inventário e 100 balas para ele. Ative antes de começar um Novo Jogo; jogos salvos não mudam."
    Patch Version: 1.0
    Patch:
      - [ be32, 0x001ac3f0, 0x60000000 ] # always write the starting slots
      - [ be32, 0x001ac408, 0x38e00008 ] # eight slots
      - [ be32, 0x001ac40c, 0x4801c3f8 ] # to the added routine
      - [ be32, 0x001c8804, 0x3cc00099 ] # address of the item list
      - [ be32, 0x001c8808, 0x60c60b60 ]
      - [ be32, 0x001c880c, 0x7ce903a6 ] # eight repetitions
      - [ be32, 0x001c8810, 0x80e60000 ] # read this slot's item
      - [ be32, 0x001c8814, 0x90e80000 ] # write it to the inventory
      - [ be32, 0x001c8818, 0x4bfff7dc ] # continue
      - [ be32, 0x001c7ff4, 0x38c60004 ] # next item in the list
      - [ be32, 0x001c7ff8, 0x39080004 ] # next inventory slot
      - [ be32, 0x001c7ffc, 0x42000814 ] # repeat while slots remain
      - [ be32, 0x001c8000, 0x38e00002 ] # restore the register
      - [ be32, 0x001c8004, 0x4bfe440c ] # back to the game
      # Starting slots: 00 ITEM 00 COUNT (0x00000000 = empty). SLOT 1 Sniper Rifle, SLOT 2 its ammo.
      - [ be32, 0x00990b60, 0x00030007 ] # SLOT 1
      - [ be32, 0x00990b64, 0x00280064 ] # SLOT 2
      - [ be32, 0x00990b68, 0x00000000 ] # SLOT 3
      - [ be32, 0x00990b6c, 0x00000000 ] # SLOT 4
      - [ be32, 0x00990b70, 0x00000000 ] # SLOT 5
      - [ be32, 0x00990b74, 0x00000000 ] # SLOT 6
      - [ be32, 0x00990b78, 0x00000000 ] # SLOT 7
      - [ be32, 0x00990b7c, 0x00000000 ] # SLOT 8

